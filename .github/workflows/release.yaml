
name: Publish on Release

on:
  release:
    types: [published]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run unit tests
        working-directory: redis_hooks
        run: cargo test

  push_to_registry:
    name: Release && Docker Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: env
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Tag
        shell: bash
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
      - name: Build Image
        shell: bash
        env:
          DUSER: ${{ secrets.DOCKER_USERNAME }}
          DPASS: ${{ secrets.DOCKER_PASSWORD }}
          TAG: ${{ steps.vars.outputs.tag }}
          REDIS_VERSION: ${{ vars.REDIS_VERSION }}
        run:  |
          echo "Building tag $TAG on Redis $REDIS_VERSION"
          echo $DPASS | docker login --username $DUSER --password-stdin
          scripts/lib-build.sh
          scripts/docker-build.sh
          docker tag shawnsarwar/redis_hooks:local shawnsarwar/redis_hooks:$TAG
          docker push shawnsarwar/redis_hooks:$TAG
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release/libredis_hooks.so
          tag: ${{ github.ref }}
          overwrite: false
