version: "3.9"

volumes:
  conf:
    driver: local
    driver_opts:
      type: none
      device: $PWD/conf
      o: bind
  
services:
  redis_with_plugin:
    container_name: redis-hooked
    # image: shawnsarwar/redis_hooks:local
    build:
      context: redis_hooks
      target: redis
      args:
        - REDIS_VERSION=${REDIS_VERSION}
    volumes:
      - conf:/conf
    ports:
      - 6379:6379
    command: "redis-server /conf/redis.conf"
    extra_hosts:
    - "host.docker.internal:host-gateway"
