services:
  redis_test:
    build:
      context: redis_hooks
      target: redis
      args:
        - REDIS_VERSION=${REDIS_VERSION}
    volumes:
      - ./test/settings.yaml:/conf/settings.yaml:ro
      - ./test/redis.conf:/conf/redis.conf:ro
    ports:
      - "16379:6379"
    command: redis-server /conf/redis.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
